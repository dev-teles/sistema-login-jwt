<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudação</title>
</head>
<body>
    <h1>Bem-vindo!</h1>
    <input type="text" placeholder="Digite seu nome">
    <p>Olá, <span id="nome"></span>! Seja bem-vindo ao nosso site.</p>
    <script>
        const inputNome = document.querySelector('input');
        const spanNome = document.getElementById('nome');

        inputNome.addEventListener('input', () => {
            spanNome.textContent = inputNome.value;
        });
    </script>
</body>
</html>
